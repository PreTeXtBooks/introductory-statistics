name: Build PreTeXt PDF

on:
  # Check that the LaTeX/PDF version compiles on every PR into master
  pull_request:
    branches:
      - master
  # Keep an up-to-date PDF bundle for the latest master
  push:
    branches:
      - master
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

concurrency:
  group: pdf-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PreTeXt CLI
        run: |
          pip install -r pretext/requirements.txt

      - name: Install TeX Live (XeLaTeX) and ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-plain-generic \
            texlive-pictures lmodern fontconfig imagemagick

      - name: Build PreTeXt book (LaTeX)
        run: |
          cd pretext
          # The LaTeX converter currently exits non-zero because the solutions
          # appendix uses bare <solution> blocks (PTX:BUG "Exercise component
          # mis-labeled"), although main.tex is still written correctly. So we
          # ignore the exit code, but still fail on any real PTX:ERROR or if
          # main.tex was not produced.
          pretext build print-latex 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee build.log || true
          if grep -q 'PTX:ERROR' build.log; then
            echo "::error::PreTeXt reported errors:"
            grep -A3 'PTX:ERROR' build.log | head -40
            exit 1
          fi
          test -f output/print-latex/main.tex

      - name: Check every image referenced by main.tex exists
        working-directory: pretext/output/print-latex
        run: |
          missing=0
          for f in $(grep -oE '\{external/[^}]+\}' main.tex | tr -d '{}' | sort -u); do
            if [ ! -e "$f" ]; then
              echo "::error::Missing image referenced by main.tex: $f"
              missing=1
            fi
          done
          exit $missing

      - name: Compile PDF with XeLaTeX
        working-directory: pretext/output/print-latex
        run: |
          # Two passes so the table of contents and cross-references resolve.
          # -halt-on-error makes any LaTeX error fail the job.
          for pass in 1 2; do
            if ! xelatex -interaction=nonstopmode -halt-on-error main.tex > /dev/null; then
              echo "::error::xelatex failed on pass $pass. First errors:"
              grep -n -A 5 '^!' main.log | head -60
              exit 1
            fi
          done
          grep -E '^Output written on' main.log

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-log
          path: pretext/output/print-latex/main.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload LaTeX bundle and PDF
        uses: actions/upload-artifact@v4
        with:
          # Ready to compile anywhere: main.tex plus the external/ images it uses.
          name: pretext-latex-bundle
          path: |
            pretext/output/print-latex/main.tex
            pretext/output/print-latex/main.pdf
            pretext/output/print-latex/external/
          retention-days: 30
